# Version: v1.2.0
name: Build and Deploy Next.js Server to Hostinger (v1.2.0)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code source
        uses: actions/checkout@v4

      - name: 2. Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Installation stricte des dépendances
        run: npm ci

      - name: 4. Compilation de l'application Next.js
        run: npm run build
        env:
          NODE_ENV: production

      - name: 5. Vérification d'intégrité et assemblage du bundle Standalone
        run: |
          if [ ! -f ".next/standalone/server.js" ]; then
            echo "ERREUR CRITIQUE : .next/standalone/server.js est introuvable."
            exit 1
          fi
          if [ -d "public" ]; then
            cp -r public .next/standalone/public
          fi
          cp -r .next/static .next/standalone/.next/static

      - name: 6. Configuration et validation de la clé SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: 7. Synchronisation Rsync et configuration LiteSpeed Node.js (.htaccess)
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          rsync -avzr --delete \
            --chmod=Du=rwx,Dg=rx,Do=rx,Fu=rw,Fg=r,Fo=r \
            --exclude='.env' \
            --exclude='.htaccess' \
            --exclude='tmp/' \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            .next/standalone/ "${SSH_USER}@${SSH_HOST}:${APP_PATH%/}/"

          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << EOF
            set -e
            TARGET_DIR="${APP_PATH%/}"
            cd "\$TARGET_DIR"

            # Détection automatique du binaire Node.js installé sur le serveur Hostinger
            NODE_BIN=\$(ls /opt/alt/alt-nodejs22/root/usr/bin/node /opt/alt/alt-nodejs20/root/usr/bin/node /usr/bin/node 2>/dev/null | head -n 1 || which node)
            echo "Binaire Node.js détecté sur Hostinger : \$NODE_BIN"

            # Génération du fichier .htaccess pour router LiteSpeed vers server.js
            cat << HTACCESS > .htaccess
          PassengerAppRoot "\$TARGET_DIR"
          PassengerBaseURI "/"
          PassengerNodejs "\$NODE_BIN"
          PassengerAppType node
          PassengerStartupFile server.js
          PassengerAppEnv production
          HTACCESS

            chmod 644 .htaccess
            mkdir -p tmp
            touch tmp/restart.txt
          EOF

      - name: 8. Nettoyage de la clé SSH
        if: always()
        run: rm -f ~/.ssh/id_deploy
