# Version: v1.1.3
name: Build and Deploy Next.js Server to Hostinger (v1.1.3)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code source
        uses: actions/checkout@v4

      - name: 2. Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Installation stricte des dépendances
        run: npm ci

      - name: 4. Compilation de l'application Next.js
        run: npm run build
        env:
          NODE_ENV: production

      - name: 5. Vérification d'intégrité et assemblage du bundle Standalone
        run: |
          # Contrôle strict : bloque immédiatement le pipeline si server.js n'a pas été généré
          if [ ! -f ".next/standalone/server.js" ]; then
            echo "ERREUR CRITIQUE : .next/standalone/server.js est introuvable."
            echo "Vérifiez que output: 'standalone' est bien actif dans next.config.mjs sur la branche main."
            exit 1
          fi

          # Copie du dossier public (s'il existe dans le dépôt)
          if [ -d "public" ]; then
            cp -r public .next/standalone/public
          fi

          # Copie des assets statiques compilés (CSS, JS client)
          cp -r .next/static .next/standalone/.next/static

          # Affiche le contenu final dans les logs GitHub Actions pour audit
          ls -la .next/standalone/

      - name: 6. Configuration et validation de la clé SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: 7. Synchronisation Rsync et redémarrage
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          rsync -avzr --delete \
            --chmod=Du=rwx,Dg=rx,Do=rx,Fu=rw,Fg=r,Fo=r \
            --exclude='.env' \
            --exclude='.htaccess' \
            --exclude='tmp/' \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            .next/standalone/ "${SSH_USER}@${SSH_HOST}:${APP_PATH%/}/"

          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p ${APP_PATH%/}/tmp && touch ${APP_PATH%/}/tmp/restart.txt && ls -la ${APP_PATH%/}/"

      - name: 8. Nettoyage de la clé SSH
        if: always()
        run: rm -f ~/.ssh/id_deploy
