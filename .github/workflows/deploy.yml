# Version: v1.1.1
name: Build and Deploy Next.js Server to Hostinger (v1.1.1)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupération du code source
        uses: actions/checkout@v4

      - name: 2. Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Installation stricte des dépendances
        run: npm ci

      - name: 4. Compilation de l'application Next.js
        run: npm run build
        env:
          NODE_ENV: production

      - name: 5. Assemblage du bundle Standalone
        run: |
          cp -r public .next/standalone/public || true
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static

      - name: 6. Configuration et validation de la clé SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Nettoie les retours chariots Windows (\r) et garantit le saut de ligne final (\n)
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Vérifie immédiatement que libcrypto accepte le format de la clé privée
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null
          # Enregistre l'empreinte du serveur Hostinger
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: 7. Synchronisation Rsync et redémarrage du serveur Node.js
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          rsync -avzr --delete --exclude='.env' \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            .next/standalone/ "$SSH_USER@$SSH_HOST:$APP_PATH"

          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p $APP_PATH/tmp && touch $APP_PATH/tmp/restart.txt"

      - name: 8. Nettoyage de la clé SSH
        if: always()
        run: rm -f ~/.ssh/id_deploy
